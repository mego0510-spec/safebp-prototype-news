            }

        <!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>地圖地點篩選</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    #container {
      display: flex;
      flex-direction: row;
      width: 100%;
      padding: 0px;
      box-sizing: border-box;
      position: relative;
    }
    #mapContainer {
      position: relative;
      display: flex;
      width: 80%;
      height: 600px;
      overflow: hidden;
    }
    #card {
      position: absolute;
      z-index: 2;
      width: 300px;
      height: 100%;
      background: rgba(250,250,250);
      color: white;
      padding: 20px;
      box-sizing: border-box;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

     #card.active {
      transform: translateX(0);
    }
    #cardTitleContainer {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #21978F;
    }
    #cardTitle {
      color: white;
      font-size: 1.17em;
      font-weight: bold;
    }
    #cardContent {
      padding: 10px;
      background: rgba(245,245,245);
    }
    #cardContent h3 {
      margin: 0 0 5px 0;
      color: black;
    }
    
    #map {
      flex: 1;
      z-index: 1;
    }
    .open-label {
      font-weight: bold;
      color: green;
    }
    .closed-label {
      font-weight: bold;
      color: red;
    }
    .hours {
      font-size: 0.9em;
      color: #555;
    }
    .normal-button {
      border: none;
      background: none;
    }

    /* 篩選區域樣式 */
    /* ------------------------------------------------------------------------------------------------ */
    .filter-group {
      width: 20%;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-direction: column;
      margin: 32px 12px;
    }

    .map-legend-group {
      width: 100%;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .map-legend {
      div {
        display: flex;
        align-items: center;
      }

      img {
        width: 40px;
        height: 40px;
      }

      span {
        font-size: 16px;
        margin-left: 8px;
      }

      .map-legend-count {
        margin-left: 40px;
      }
    }

    .dropdown-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1; /* 平均分配寬度 */
      display: flex;
      flex-direction: column;
      font-size: 14px;
      min-width: 0; /* 防止超出 */
    }

    .form-group > label {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .custom-select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
      font-size: 16px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23999' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 32px;
    }

    .custom-select:disabled {
      background-color: #f5f5f5;
      color: #999;
      cursor: not-allowed;
    }

    .search-btn {
      padding: 12px 48px;
      background-color: #21978F;
      color: white;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .search-btn:hover {
      background-color: #27b1a8;
    }

    @media (max-width: 768px) {
       #container {
        flex-direction: column;
      }

      #mapContainer {
        width: auto;
      }

      .filter-group {
        width: auto;
      }

      .dropdown-group {
        flex-direction: column;
        align-items: stretch;
      }

      .form-group {
        width: 100%;
      }

      .search-btn {
        width: 100%;
        margin-top: 0.5rem;
        align-self: stretch;
      }

      .map-legend {
        width: 100%;
      }
    }
    /* ------------------------------------------------------------------------------------------------ */
  </style>
</head>

          </select>
        </div>

            <option value="all" selected>不限</option>
            <option value="open">開放中</option>
            <option value="close">非開放中</option>

        </div>

            <option value="x">不清楚</option>
            <option value="Y">其他</option>
            <option value="Z">未填寫</option>
          </select>
        </div>
      </div>

      <button class="search-btn" onclick="moveToLocation()">搜尋</button>

      const city = document.getElementById('city').value;
      const districtSelect = document.getElementById('district');

      if (locations[city]) {
        for (const district in locations[city]) {
          const option = document.createElement('option');
          option.value = district;
          option.textContent = district;
          districtSelect.appendChild(option);
        }
      }
    }

    function isOpenNow(openHours) {
      const now = new Date();
      const day = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][
        now.getDay()
      ];
      const time = now.toTimeString().slice(0, 5); // "HH:MM"
      if (!openHours[day] || openHours[day].length !== 2) return false;
      return openHours[day][0] <= time && time <= openHours[day][1];
    }

    function formatHours(openHours) {
      return ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
        .map((d, idx) => {
          const zh = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"][idx];
          if (!openHours[d] || openHours[d].length !== 2)
            return `${zh}：未開放`;
          return `${zh}：${openHours[d][0]} ~ ${openHours[d][1]}`;
        })
        .join("<br>");
    }

    function formatType(type) {
      switch (type) {
        case "A":
          return "血壓站（申請中）"
        case "B":
          return "安心血壓站（合格級）"
        case "C":
          return "安心血壓站+（優良級）"
      }
    }

    function formatMachineType(type) {
      switch (type) {
        // case "A":
        //   return "壓脈帶"
        // case "B":
        //   return "隧道式"
        case "A":
          return "上臂式血壓計"
        case "B":
          return "隧道式血壓計"
        case "C":
          return "手腕式血壓計"
        case "X":
          return "不清楚"
        case "Y":
          return "其他"
        case "Z":
          return "未填寫"
        default:
          return "未填寫"
      }
    }

    function formatMarkIcon(type) {
      const svgStringTypeA = `
        <svg width="40" height="40" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3-7-7-7z" fill="#E74C3C"/>
          <circle cx="12" cy="9" r="2.5" fill="white"/>
        </svg>
      `;

      const svgUrlTypeA = "data:image/svg+xml;base64," + btoa(svgStringTypeA);
      const pngUrlTypeB = "https://framerusercontent.com/images/ld0NFMichGukZc3UGdO7WpmJHfE.png?width=1000&height=1000";
      const pngUrlTypeC = "https://framerusercontent.com/images/iFXLIPTPcxdu3cdnu18cgDP7U.png?width=1000&height=1000";

      let iconUrl = svgUrlTypeA;

      switch (type) {
        case "A":
          iconUrl = svgUrlTypeA
          break
        case "B":
          iconUrl = pngUrlTypeB
          break
        case "C":
          iconUrl = pngUrlTypeC
          break
      }

      return L.icon({
        iconUrl: iconUrl,
        iconSize: [40, 40],
        iconAnchor: [20, 40],
        popupAnchor: [0, -40]
      });
    }

    function closeCard() {
      const card = document.getElementById("card");
      card.classList.remove("active");
    }

    function showCard(item) {
      const cardTitle = document.getElementById("cardTitle");
      cardTitle.innerText = item.name

      const cardContent = document.getElementById("cardContent");
      cardContent.innerHTML = `
        <h3>站點等級：${formatType(item.type)}</h3>
        <h3>血壓計類型：${formatMachineType(item.machineType)}</h3>
        <h3>開放時間：</h3>
        <div class="hours">${formatHours(item.openHours)}</div>
        <p>${isOpenNow(item.openHours)
          ? '<span class="open-label">✅ 現在開放中</span>'
          : '<span class="closed-label">❌ 現在未開放</span>'}</p>
      `;
      cardContent.style.display = "block";

      const goGoogleMapButton = document.getElementById("cardGoGoogleMapButton");
      goGoogleMapButton.onclick = () => {
        window.open(`https://www.google.com/maps/dir//${item.lat},${item.lng}`);
      }

      const card = document.getElementById("card");
      card.classList.add("active");
    }

    function updateMarkers() {
      markers.forEach((m) => map.removeLayer(m));
      markers.length = 0;

      const selectedTypes = Array(document.getElementById('level').value)
        .filter((v) => v === "A" || v === "B" || v === "C" || v === "all");

      const selectedMachineType = Array(document.getElementById('machineType').value)
        .filter((v) => v === "A" || v === "B" || v === "C" || v === "all");

      const selectedOpenStatus = Array(document.getElementById('openStatus').value)

      data.forEach((d) => {
        // 選站點等級
        if (!selectedTypes.includes("all") && !selectedTypes.includes(d.type)) return;

        // 選血壓計類型
        if (!selectedMachineType.includes("all") && !selectedMachineType.includes(d.machineType)) return;

        // 選站點開放狀態
        if (selectedOpenStatus == "open" && !isOpenNow(d.openHours)) return;
        if (selectedOpenStatus == "close" && isOpenNow(d.openHours)) return;

        const marker = L.marker([d.lat, d.lng], { icon: formatMarkIcon(d.type) })
          .addTo(map)
          .on("click", () => showCard(d));
        markers.push(marker);
      });
    }

    function initMarkers() {
      const apiUrl = "https://script.google.com/macros/s/AKfycbwHX7C49Sy0gIX0aZ20Lf79TFePBEXig-db9pUkdBa0DK1wimPgQPMaiuQDP7-Jf18c/exec"
    
      fetch(apiUrl)
        .then(response => response.json())
        .then(response => {
          // console.log(response.data);
          setMarkers(response)
        })
        .catch(error => {
          // 當無法透過 api 取得站點清單時，使用舊有寫在程式中的資料
          console.error("錯誤：", error)
          setMarkers(data)
        });
    }

    function setMarkers(newData) {
      markers.forEach((m) => map.removeLayer(m));
      markers.length = 0;

      const selectedTypes = Array(document.getElementById('level').value)
        .filter((v) => v === "A" || v === "B" || v === "C" || v === "all");

      const selectedMachineType = Array(document.getElementById('machineType').value)
        .filter((v) => v === "A" || v === "B" || v === "C" || v === "all");

      const selectedOpenStatus = Array(document.getElementById('openStatus').value)

      newData.forEach((d) => {
            // 選站點等級
            if (!selectedTypes.includes("all") && !selectedTypes.includes(d.type)) return;

            // 選血壓計類型
            if (!selectedMachineType.includes("all") && !selectedMachineType.includes(d.machineType)) return;

            // 選站點開放狀態
            if (selectedOpenStatus == "open" && !isOpenNow(d.openHours)) return;
            if (selectedOpenStatus == "close" && isOpenNow(d.openHours)) return;

            const marker = L.marker([d.lat, d.lng], { icon: formatMarkIcon(d.type) })
              .addTo(map)
              .on("click", () => showCard(d));
            markers.push(marker);
          })
          
          data = newData

          let applyingCount = newData.filter((value) => value.type == "A").length
          let qualifiedCount = newData.filter((value) => value.type == "B").length
          let excellentCount = newData.filter((value) => value.type == "C").length

          document.getElementById("applyingCount").textContent = `共 ${applyingCount > 0 ? excellentCount : "-"} 站`
          document.getElementById("qualifiedCount").textContent = `共 ${qualifiedCount > 0 ? qualifiedCount : "-"} 站`
          document.getElementById("excellentCount").textContent = `共 ${excellentCount > 0 ? excellentCount : "-"} 站`
    }

    initMarkers();
  </script>

        <script type="module">
            let height = 0

            function sendEmbedHeight() {
                window.parent.postMessage({
                    embedHeight: height
                }, "*")
            }

            const observer = new ResizeObserver((entries) => {
                if (entries.length !== 1) return
                const entry = entries[0]
                if (entry.target !== document.body) return

                height = entry.contentRect.height
                sendEmbedHeight()
            })

            observer.observe(document.body)

            window.addEventListener("message", (event) => {
                if (event.source !== window.parent) return
                if (event.data !== "getEmbedHeight") return
                sendEmbedHeight()
            })
        </script>
